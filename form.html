<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Share your product experience by submitting a review. Rate features, installation date, and provide feedback on our products." />
    <meta name="author" content="Lawrence Adekunle" />
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css" />
    <script src="scripts/script.js" defer></script>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Product Review</h1>
            <p class="header-subtitle">Share your experience with our products</p>
        </div>
    </header>

    <main>
        <div class="review-card">
            <form id="reviewForm" method="get" action="review.html" novalidate>

                <!-- 1. Product Name (select, required) -->
                <div class="form-group">
                    <label for="productSelect">Product Name <span class="label-hint" aria-hidden="true">*</span></label>
                    <select id="productSelect" name="product" required aria-required="true">
                        <option value="" disabled selected>Select a Product …</option>
                    </select>
                </div>

                <!-- 2. Overall Rating (radio, required) -->
                <div class="form-group">
                    <label>Overall Rating <span class="label-hint" aria-hidden="true">*</span></label>
                    <div class="rating-group" id="ratingGroup" role="radiogroup">
                        <span class="rating-option">
                            <!-- ✅ FIXED: Added required to ALL radio inputs -->
                            <input type="radio" name="rating" id="rating1" value="1" required aria-required="true">
                            <label for="rating1" class="star-label">★☆☆☆☆</label>
                        </span>
                        <span class="rating-option">
                            <!-- ✅ FIXED: Added required to ALL radio inputs -->
                            <input type="radio" name="rating" id="rating2" value="2" required aria-required="true">
                            <label for="rating2" class="star-label">★★☆☆☆</label>
                        </span>
                        <span class="rating-option">
                            <!-- ✅ FIXED: Added required to ALL radio inputs -->
                            <input type="radio" name="rating" id="rating3" value="3" required aria-required="true">
                            <label for="rating3" class="star-label">★★★☆☆</label>
                        </span>
                        <span class="rating-option">
                            <!-- ✅ FIXED: Added required to ALL radio inputs -->
                            <input type="radio" name="rating" id="rating4" value="4" required aria-required="true">
                            <label for="rating4" class="star-label">★★★★☆</label>
                        </span>
                        <span class="rating-option">
                            <!-- ✅ FIXED: Added required to ALL radio inputs -->
                            <input type="radio" name="rating" id="rating5" value="5" required aria-required="true">
                            <label for="rating5" class="star-label">★★★★★</label>
                        </span>
                    </div>
                </div>

                <!-- 3. Date of Installation -->
                <div class="form-group">
                    <label for="installDate">Date of Installation <span class="label-hint" aria-hidden="true">*</span></label>
                    <input type="date" id="installDate" name="installDate" required aria-required="true" />
                </div>

                <!-- 4. Useful Features (checkboxes) -->
                <div class="form-group">
                    <label>Which features did you find useful? <span class="label-hint">(check all that apply)</span></label>
                    <div class="checkbox-grid">
                        <span class="checkbox-item">
                            <input type="checkbox" id="featDurability" name="features" value="durability" required aria-required="true">
                            <label for="featDurability">Durability</label>
                        </span>
                        <span class="checkbox-item">
                            <input type="checkbox" id="featEase" name="features" value="ease">
                            <label for="featEase">Ease of Use</label>
                        </span>
                        <span class="checkbox-item">
                            <input type="checkbox" id="featPerformance" name="features" value="performance">
                            <label for="featPerformance">Performance</label>
                        </span>
                        <span class="checkbox-item">
                            <input type="checkbox" id="featDesign" name="features" value="design">
                            <label for="featDesign">Design</label>
                        </span>
                    </div>
                </div>

                <!-- 5. Written Review (optional) -->
                <div class="form-group">
                    <label for="reviewText">Written Review <span class="label-hint">(optional)</span></label>
                    <textarea id="reviewText" name="review" placeholder="Tell us more about your experience …"></textarea>
                </div>

                <!-- 6. Your Name (optional) -->
                <div class="form-group">
                    <label for="userName">Your Name <span class="label-hint">(optional)</span></label>
                    <input type="text" id="userName" name="userName" placeholder="e.g. Lawrence Adekunle" />
                </div>

                <!-- Action buttons -->
                <div class="action-bar">
                    <button type="reset" class="button button-outline">Clear</button>
                    <button type="submit" class="button button-primary">Post Review</button>
                </div>

            </form>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <span>&copy; 2024 Surulere, Lagos, Nigeria</span>
            <span class="badge">Product Review Form</span>
            <span id="lastModified">Last Modified: </span>
        </div>
    </footer>
</body>
</html>
